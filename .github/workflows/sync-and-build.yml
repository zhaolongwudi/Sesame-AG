name: Sync & Build Sesame-AG

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '即使上游无更新也强制构建'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'

permissions:
  contents: write
  actions: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Sesame-AG/Sesame-AG.git || true
          git fetch upstream dev --quiet

      - name: Check for new commits
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/dev)
          LOCAL_HEAD=$(git rev-parse HEAD)
          echo "upstream_head=${UPSTREAM_HEAD}" >> $GITHUB_OUTPUT
          echo "local_head=${LOCAL_HEAD}" >> $GITHUB_OUTPUT

          FORCE="${{ github.event.inputs.force || 'false' }}"

          if [ "$FORCE" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            NEW_COUNT=$(git rev-list --count ${LOCAL_HEAD}..${UPSTREAM_HEAD} 2>/dev/null || echo 0)
            echo "commit_count=${NEW_COUNT}" >> $GITHUB_OUTPUT
            echo "::notice::Force build enabled"
          elif [ "${UPSTREAM_HEAD}" = "${LOCAL_HEAD}" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::Already up to date with upstream"
          elif git merge-base --is-ancestor ${UPSTREAM_HEAD} ${LOCAL_HEAD} 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::Local is ahead of upstream, no new upstream commits"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            NEW_COUNT=$(git rev-list --count ${LOCAL_HEAD}..${UPSTREAM_HEAD})
            echo "commit_count=${NEW_COUNT}" >> $GITHUB_OUTPUT
            echo "::notice::Detected ${NEW_COUNT} new upstream commits"
          fi

      - name: Collect upstream commit log
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git log --format="%h %s" --no-merges upstream/dev -6 > /tmp/commit_log.txt
          cat /tmp/commit_log.txt

      - name: Extract APK version
        if: steps.check.outputs.has_changes == 'true'
        id: version
        run: |
          APK_VERSION=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "apk_version=${APK_VERSION}" >> $GITHUB_OUTPUT
          echo "App version: ${APK_VERSION}"

      - name: Show upstream diff summary
        if: steps.check.outputs.has_changes == 'true'
        run: |
          LOCAL_HEAD="${{ steps.check.outputs.local_head }}"
          UPSTREAM_HEAD="${{ steps.check.outputs.upstream_head }}"
          echo "=== Files changed ==="
          git diff --stat ${LOCAL_HEAD}..${UPSTREAM_HEAD} | head -30

      - name: Merge upstream changes
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          if git merge upstream/dev --ff-only -m "sync: merge upstream/dev [skip ci]"; then
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "::notice::Fast-forward merge succeeded"
          else
            echo "::warning::Fast-forward merge failed, trying regular merge"
            git merge upstream/dev --no-edit -m "sync: merge upstream/dev [skip ci]"
            echo "merged=true" >> $GITHUB_OUTPUT
            echo "::notice::Regular merge succeeded"
          fi

      - name: Push to target repo
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.merged == 'true'
        run: |
          git push origin dev

      - name: Setup JDK 17
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: steps.check.outputs.has_changes == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Cache Gradle
        if: steps.check.outputs.has_changes == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Build Release APK
        if: steps.check.outputs.has_changes == 'true'
        env:
          CI: 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect build info
        if: steps.check.outputs.has_changes == 'true'
        id: build_info
        run: |
          COMMIT_COUNT="${{ steps.check.outputs.commit_count }}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "commit_count=${COMMIT_COUNT}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "Build: ${COMMIT_SHA}, ${COMMIT_COUNT} commits"

      - name: Upload APK artifact
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-${{ steps.build_info.outputs.commit_sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Send email notification
        if: steps.check.outputs.has_changes == 'true'
        continue-on-error: true
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          COMMIT_COUNT: ${{ steps.build_info.outputs.commit_count }}
          COMMIT_SHA: ${{ steps.build_info.outputs.commit_sha }}
          BUILD_TIME: ${{ steps.build_info.outputs.build_time }}
          APK_VERSION: ${{ steps.version.outputs.apk_version }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - "$@" << 'PYEOF'
          import smtplib, os, sys
          from email.mime.text import MIMEText

          commit_count = os.environ['COMMIT_COUNT']
          commit_sha = os.environ['COMMIT_SHA']
          build_time = os.environ.get('BUILD_TIME', 'unknown')
          apk_version = os.environ.get('APK_VERSION', '0.0.0')
          workflow_url = os.environ['WORKFLOW_URL']

          if not os.environ.get('SMTP_SERVER'):
              print('SMTP_SERVER not configured, skipping email')
              sys.exit(0)

          run_id = workflow_url.rstrip('/').split('/')[-1]
          artifact_name = f'Sesame-AG-{commit_sha}'
          download_url = f'https://nightly.link/zhaolongwudi/Sesame-AG/actions/runs/{run_id}/{artifact_name}.zip'

          try:
              with open('/tmp/commit_log.txt') as f:
                  commit_log = f.read().strip()
          except Exception:
              commit_log = '(unavailable)'

          body = '\n'.join([
              'Sesame-AG 自动构建通知',
              '========================',
              '',
              f'版本号: v{apk_version} ({commit_sha})',
              f'更新提交: {commit_count} 条',
              '',
              '近6次更新:',
              '----------------------------------------',
              commit_log,
              '----------------------------------------',
              '',
              f'构建时间: {build_time}',
              '',
              f'下载链接: {download_url}',
              '',
              f'GitHub Actions: {workflow_url}',
          ])

          msg = MIMEText(body, 'plain', 'utf-8')
          msg['From'] = os.environ['FROM_EMAIL']
          msg['To'] = os.environ['TO_EMAIL']
          msg['Subject'] = f'[Sesame-AG] 新构建 - {commit_count} 条提交 - {commit_sha}'

          try:
              server = smtplib.SMTP_SSL(
                  os.environ['SMTP_SERVER'],
                  int(os.environ.get('SMTP_PORT', '465')),
                  timeout=30
              )
              server.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
              server.sendmail(
                  os.environ['FROM_EMAIL'],
                  os.environ['TO_EMAIL'],
                  msg.as_string()
              )
              server.quit()
              print(f'Email sent to {os.environ["TO_EMAIL"]}')
          except Exception as e:
              print(f'Email failed: {e}', file=sys.stderr)
              sys.exit(0)
          PYEOF

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.has_changes }}" = "true" ]; then
            {
              echo "## Build Completed - ${{ steps.build_info.outputs.commit_count }} new commits"
              echo ""
              echo "| 项目 | 值 |"
              echo "|------|-----|"
              echo "| 版本号 | v${{ steps.version.outputs.apk_version }}"
              echo "| Commit | ${{ steps.build_info.outputs.commit_sha }}"
              echo "| 时间 | ${{ steps.build_info.outputs.build_time }}"
              echo ""
              echo "### 更新内容"
              echo '```'
              cat /tmp/commit_log.txt
              echo '```'
              echo ""
              echo "[下载 APK](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "## No Changes"
              echo "Upstream is up to date."
            } >> $GITHUB_STEP_SUMMARY
          fi
