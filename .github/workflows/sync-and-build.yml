name: Sync & Build Sesame-AG

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if no new upstream commits'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - dev

permissions:
  contents: write
  actions: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure push token
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
          fi

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Sesame-AG/Sesame-AG.git || true
          git fetch upstream dev --quiet

      - name: Check for new commits
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/dev)
          LOCAL_HEAD=$(git rev-parse HEAD)
          echo "upstream_head=${UPSTREAM_HEAD}" >> $GITHUB_OUTPUT
          echo "local_head=${LOCAL_HEAD}" >> $GITHUB_OUTPUT

          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}"

          if [ "$FORCE" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            NEW_COUNT=$(git rev-list --count ${LOCAL_HEAD}..${UPSTREAM_HEAD})
            echo "commit_count=${NEW_COUNT}" >> $GITHUB_OUTPUT
            echo "Force build enabled"
          elif git merge-base --is-ancestor ${UPSTREAM_HEAD} ${LOCAL_HEAD} 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new upstream commits"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            NEW_COUNT=$(git rev-list --count ${LOCAL_HEAD}..${UPSTREAM_HEAD})
            echo "commit_count=${NEW_COUNT}" >> $GITHUB_OUTPUT
            echo "Detected ${NEW_COUNT} new upstream commits"
          fi

      - name: Collect upstream commit log
        if: steps.check.outputs.has_changes == 'true'
        id: commit_log
        run: |
          UPSTREAM_HEAD="${{ steps.check.outputs.upstream_head }}"
          LOCAL_HEAD="${{ steps.check.outputs.local_head }}"
          git log --oneline --no-merges ${LOCAL_HEAD}..${UPSTREAM_HEAD} > /tmp/commit_log.txt
          echo "log_file=/tmp/commit_log.txt" >> $GITHUB_OUTPUT

      - name: Fetch upstream diff summary
        if: steps.check.outputs.has_changes == 'true'
        run: |
          UPSTREAM_HEAD="${{ steps.check.outputs.upstream_head }}"
          LOCAL_HEAD="${{ steps.check.outputs.local_head }}"
          git diff --stat ${LOCAL_HEAD}..${UPSTREAM_HEAD} | head -30

      - name: Merge upstream changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git merge upstream/dev --ff-only -m "sync: merge upstream dev branch [skip ci]"

      - name: Push to target repo
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git push origin dev

      - name: Setup JDK 17
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: steps.check.outputs.has_changes == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Cache Gradle
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        if: steps.check.outputs.has_changes == 'true'
        run: chmod +x ./gradlew

      - name: Build Release APK
        if: steps.check.outputs.has_changes == 'true'
        env:
          CI: 'true'
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect build info
        if: steps.check.outputs.has_changes == 'true'
        id: build_info
        run: |
          COMMIT_COUNT="${{ steps.check.outputs.commit_count }}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "commit_count=${COMMIT_COUNT}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-APK-${{ steps.build_info.outputs.commit_sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Prepare email script
        if: steps.check.outputs.has_changes == 'true'
        run: |
          cat > /tmp/send_email.py << 'PYEOF'
          import smtplib, os
          from email.mime.text import MIMEText

          commit_count = os.environ['COMMIT_COUNT']
          commit_sha = os.environ['COMMIT_SHA']
          build_time = os.environ['BUILD_TIME']
          workflow_url = os.environ['WORKFLOW_URL']

          with open('/tmp/commit_log.txt') as f:
              commit_log = f.read().strip()

          body = '\n'.join([
              'Sesame-AG Auto Build Completed',
              '',
              'Build Time: ' + build_time,
              'New Commits: ' + commit_count,
              'Latest SHA: ' + commit_sha,
              '',
              '====== Update Log ======',
              commit_log,
              '',
              '====== Download APK ======',
              workflow_url,
              '',
              'Repository: https://github.com/zhaolongwudi/Sesame-AG/',
          ])

          msg = MIMEText(body, 'plain', 'utf-8')
          msg['From'] = os.environ['FROM_EMAIL']
          msg['To'] = os.environ['TO_EMAIL']
          msg['Subject'] = '[Sesame-AG] New Build - ' + commit_count + ' commits'

          server = smtplib.SMTP_SSL(
              os.environ['SMTP_SERVER'],
              int(os.environ['SMTP_PORT']),
              timeout=30
          )
          server.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
          server.sendmail(os.environ['FROM_EMAIL'], os.environ['TO_EMAIL'], msg.as_string())
          server.quit()
          print('Email sent successfully')
          PYEOF

      - name: Send email notification
        if: steps.check.outputs.has_changes == 'true'
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          COMMIT_COUNT: ${{ steps.build_info.outputs.commit_count }}
          COMMIT_SHA: ${{ steps.build_info.outputs.commit_sha }}
          BUILD_TIME: ${{ steps.build_info.outputs.build_time }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 /tmp/send_email.py

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.has_changes }}" = "true" ]; then
            echo "## Build Completed - ${{ steps.build_info.outputs.commit_count }} new commits" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/commit_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- SHA: ${{ steps.build_info.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
            echo "- Time: ${{ steps.build_info.outputs.build_time }}" >> $GITHUB_STEP_SUMMARY
            echo "- [Download APK](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "## No Changes" >> $GITHUB_STEP_SUMMARY
            echo "Upstream is up to date." >> $GITHUB_STEP_SUMMARY
          fi
