name: Sesame-AG Dev自动打包
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

# 解决第一个问题：Node.js 20废弃警告，提前切到Node.js 24运行
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4
        with:
          # 解决第二个问题：Git exit 128错误，拉取完整Git历史+子模块
          fetch-depth: 0
          submodules: true
      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: 授予Gradle执行权限（避免权限报错）
        run: chmod +x ./gradlew
      - name: Gradle编译APK
        run: ./gradlew assembleRelease
      - name: 保存安装包
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-Dev编译APK
          path: app/build/outputs/apk/release/*.apk