name: Build Sesame-AG APK
run-name: ${{ github.actor }} is building Sesame-AG APK 🚀

on:
  push:
    branches: [ "Sesame-AG", "main", "dev" ]
  pull_request:
    branches: [ "Sesame-AG", "main", "dev" ]
  workflow_dispatch: # 支持手动触发构建

jobs:
  build_apk:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      JAVA_HOME: /usr/lib/jvm/default-java
    permissions:
      contents: write
      packages: read
      statuses: write

    steps:
      - name: 配置 Git 用户信息
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false

      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          submodules: false

      # 新增：删除无效子模块目录 + 清空子模块配置，根治报错
      - name: 清理无效子模块
        run: |
          rm -rf libxposed/api
          rm -f .gitmodules
          git rm --cached libxposed/api 2>/dev/null || true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 配置 Gradle 权限
        run: chmod +x gradlew

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 构建 APK（Release 包）
        run: ./gradlew assembleRelease

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-Release-APK
          path: app/build/outputs/apk/release/
          retention-days: 30
