name: 每日同步原作者源码
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  sync-code:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: 检出完整代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 修复核心：保留Git凭证，给后续push授权，解决exit 128权限错误
          persist-credentials: true
          submodules: false

      - name: 清理原有子模块配置
        run: |
          rm -rf libxposed/api 2>/dev/null || true
          git rm --cached libxposed/api 2>/dev/null || true
          rm -f .gitmodules 2>/dev/null || true

      - name: 配置Git用户信息
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global core.autocrlf false

      - name: 绑定原作者上游仓库
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Sesame-AG/Sesame-AG.git
          git fetch --all --prune

      - name: 同步main分支
        run: |
          # 不管本地有没有分支，强制对齐上游原作者代码
          git checkout -B main upstream/main
          git push origin main -f

      - name: 同步dev分支
        run: |
          git checkout -B dev upstream/dev
          git push origin dev -f

      - name: 同步更新子模块
        run: |
          git submodule update --init --recursive
          # 提交子模块更新（没有变更会自动跳过不报错）
          if [ -f .gitmodules ] && [[ $(git status --porcelain) ]]; then
            git add .
            git commit -m "sync: update submodules from upstream"
            git push origin dev
          fi